services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-gestor}
      POSTGRES_USER: ${DB_USERNAME:-gestor}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "5433:5432"

  init:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    env_file: .env
    volumes:
      - ./:/var/www/html
    depends_on:
      postgres:
        condition: service_healthy
    command: >
      sh -c "composer install --no-interaction --prefer-dist &&
             php artisan migrate --force &&
             php artisan db:seed --force &&
             php artisan storage:link || true"

  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./:/var/www/html
    depends_on:
      init:
        condition: service_completed_successfully
    expose:
      - "9000"

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app

  queue:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./:/var/www/html
    depends_on:
      init:
        condition: service_completed_successfully
    command: php artisan queue:work --sleep=2 --tries=3 --timeout=120

  scheduler:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./:/var/www/html
    depends_on:
      init:
        condition: service_completed_successfully
    command: php artisan schedule:work

volumes:
  postgres-data:
